<script>
const D=[
["E",1,"Definisi ekonomi?","Kajian bagaimana individu dan masyarakat menggunakan sumber terhad untuk memenuhi kehendak tidak terhad, melibatkan alternatif."],
["E",1,"Definisi mikroekonomi?","Kajian tingkah laku individu, isi rumah dan firma dalam membuat keputusan dan mengagihkan sumber. Skop kecil."],
["E",1,"Definisi makroekonomi?","Kajian pembolehubah agregat (ekonomi keseluruhan): pengangguran, kadar pertumbuhan, KDNK, inflasi. Skop besar/global."],
["E",1,"Konsep utama mikro vs makro?","Mikro: permintaan & penawaran, keanjalan, kos pengeluaran, struktur pasaran.\nMakro: GDP, inflasi, pengangguran, dasar monetari & fiskal."],
["E",1,"4 sumber ekonomi dan bayarannya?","Labour: gaji/upah\nCapital: faedah\nLand: sewa\nEntrepreneur: keuntungan"],
["E",1,"Apa itu labour?","Semua input manusia (fizikal & mental) dalam pengeluaran. Cth: doktor, pensyarah."],
["E",1,"Apa itu capital?","Input pengeluaran yang dihasilkan sendiri. Cth: mesin, kilang, peralatan."],
["E",1,"Ciri land sebagai sumber?","Sumber asli di permukaan bumi/dasar laut. Terhad, tetap, tidak homogen. Nilai ikut lokasi & kualiti."],
["E",1,"Apa itu entrepreneur?","Individu yang menggabungkan semua sumber untuk menghasilkan barang & perkhidmatan."],
["E",1,"3 kategori barang dalam ekonomi?","Economic goods, Free goods, Public goods."],
["E",1,"2 jenis economic goods?","Consumer goods (barang akhir, cth fan, makanan) dan Capital goods (untuk hasilkan barang lain, cth mesin, kilang)."],
["E",1,"Apa itu free goods?","Barang tidak terhad, tersedia tanpa kos. Tiada harga, opportunity cost = 0. Cth: udara, air."],
["E",1,"Apa itu public goods?","Barang non-excludable, dibiayai kerajaan melalui cukai. Cth: loji janakuasa."],
["E",1,"Masalah ekonomi asas?","Sumber terhad tetapi kehendak tidak terhad. Melahirkan: scarcity, choice, opportunity cost."],
["E",1,"Apa itu scarcity?","Kehendak sentiasa melebihi sumber yang terhad. Individu: masa/wang; firma: modal; kerajaan: kewangan."],
["E",1,"Apa itu choice?","Pilihan yang timbul daripada scarcity. Pengguna: maksimumkan kepuasan; firma: maksimumkan keuntungan; kerajaan: ikut keutamaan."],
["E",1,"Apa itu opportunity cost?","Alternatif kedua terbaik yang dikorbankan apabila membuat satu pilihan."],
["E",1,"Apa itu PPC?","Pelbagai kombinasi barang yang boleh dihasilkan dalam tempoh tertentu dengan semua sumber digunakan sepenuhnya & cekap. Terangkan scarcity, choice, opportunity cost."],
["E",1,"Andaian PPC?","1 orang & 2 produk; kecekapan penuh (full employment); sumber tetap kuantiti & kualiti; teknologi tetap."],
["E",1,"Maksud titik X (dalam), Z (luar), A-F (atas) pada PPC?","Dalam: membazir/tidak cekap/pengangguran.\nLuar: tidak boleh dicapai (scarcity).\nAtas: choice.\nBergerak antara titik: opportunity cost."],
["E",1,"4 soalan ekonomi asas?","What to produce? How much to produce? How to produce? For whom to produce?"],
["E",1,"Terangkan 4 soalan asas.","What: jenis barang.\nHow: kaedah termurah.\nHow much: kecekapan teknikal & ekonomi.\nFor whom: agihan pendapatan."],
["E",1,"4 sistem ekonomi dunia?","Capitalism, Socialism, Mixed economy, Islamic economy."],
["E",1,"Capitalism: nama lain & contoh?","Free market, laissez-faire, market economy. Cth: USA, Jepun, Jerman."],
["E",1,"Ciri-ciri capitalism?","Keputusan individu, campur tangan kerajaan minimum; price mechanism; kebebasan berusaha & memilih; maksimumkan keuntungan; self-interest."],
["E",1,"Kebaikan capitalism?","Sumber digunakan cekap; galak R&D & persaingan; insentif bekerja."],
["E",1,"Keburukan capitalism?","Agihan pendapatan tidak adil; inflasi & pengangguran tinggi; kebajikan diabaikan; pembaziran sumber."],
["E",1,"Capitalism selesaikan masalah asas?","What: kuasa demand & supply.\nHow: output maksimum kos minimum.\nFor whom: mereka yang sanggup & mampu membayar."],
["E",1,"Socialism: nama lain & contoh?","Central/command/planned economy, communist. Cth: China, Korea Utara, Cuba."],
["E",1,"Ciri-ciri socialism?","Pemilikan awam sumber; perancangan ekonomi pusat; penggunaan price mechanism terhad."],
["E",1,"Kebaikan socialism?","Keadilan sosial; peruntukan sumber lebih baik; pertumbuhan ekonomi baik; cekap pengeluaran."],
["E",1,"Keburukan socialism?","Kesilapan keputusan; kurang motivasi; kurang R&D; hilang kebebasan ekonomi; pembaziran sumber."],
["E",1,"Socialism selesaikan masalah asas?","What: lebih barang kebajikan.\nHow: teknik ikut kebajikan sosial.\nFor whom: semua ahli masyarakat."],
["E",1,"Mixed economy: contoh & ciri?","Gabungan capitalism & socialism. Cth: Malaysia, Singapura, India.\nCiri: pemilikan awam & swasta; price mechanism + pelan ekonomi; kerajaan kawal jurang & campur tangan."],
["E",1,"Kebaikan & keburukan mixed economy?","Baik: peruntukan cekap, lebih pilihan, kerjasama kerajaan-swasta, kawal monopoli, kestabilan.\nBuruk: konflik kepentingan, pengaruh luar negatif."],
["E",2,"Definisi demand?","Keupayaan dan kesanggupan membeli kuantiti barang/perkhidmatan tertentu pada harga tertentu dalam tempoh tertentu, ceteris paribus."],
["E",2,"Maksud ceteris paribus?","Frasa Latin: faktor lain dianggap tetap."],
["E",2,"Hukum permintaan?","Harga naik, kuantiti diminta turun; harga turun, kuantiti diminta naik. Hubungan negatif; keluk menurun dari kiri ke kanan."],
["E",2,"Market demand vs individual demand?","Individual: seorang pengguna.\nMarket: jumlah semua individu (penjumlahan mendatar keluk individu)."],
["E",2,"Format fungsi permintaan?","Qd = a - bP\na: Qd bila P=0; b: kecerunan; P: harga."],
["E",2,"3 cara terbit fungsi permintaan?","1. Using function (formula titik-kecerunan)\n2. Simultaneous equation\n3. Mathematical equation (b = ΔQ/ΔP)"],
["E",2,"Cara cari fungsi dari jadual (Method 3)?","b = (Q2-Q1)/(P2-P1), ambil nilai positif utk Qd = a - bP. Kemudian a = Q + bP.\nCth: P1→100, P2→94: b=6, a=100+6=106. Qd = 106 - 6P"],
["E",2,"Fungsi dari jadual: P1=30, P2=28 (Qd)?","b=2, a=30+2=32.\nQd = 32 - 2P"],
["E",2,"Faktor dalaman (internal) yang pengaruhi demand?","Harga barang itu sendiri, pendapatan pengguna, jangkaan harga, citarasa & pilihan, iklan & pemasaran."],
["E",2,"Faktor luaran (external) yang pengaruhi demand?","Harga barang lain, populasi & demografi, dasar kerajaan, musim, kadar faedah, bilangan pengguna, agihan pendapatan."],
["E",2,"Substitute goods: kesan harga?","Harga A naik, demand B naik. Arah yang sama. Cth: kopi & teh."],
["E",2,"Complementary goods: kesan harga?","Harga A naik, demand B turun. Arah bertentangan. Cth: kereta & petrol."],
["E",2,"Normal goods vs inferior goods?","Normal: pendapatan naik, demand naik.\nInferior: pendapatan naik, demand turun."],
["E",2,"Kesan jangkaan harga pada demand?","Jangkaan harga masa depan lebih tinggi: demand semasa naik. Lebih rendah: demand semasa turun."],
["E",2,"Change in quantity demanded vs change in demand?","Quantity demanded: bergerak sepanjang keluk, sebab harga barang itu sendiri.\nDemand: keluk beralih (shift), sebab faktor lain, harga tetap."],
["E",2,"Definisi supply?","Kuantiti barang/perkhidmatan yang pengeluar sanggup & mampu tawarkan pada harga tertentu dalam tempoh tertentu."],
["E",2,"Hukum penawaran?","Harga naik, kuantiti ditawar naik (hubungan positif), ceteris paribus. Keluk menaik dari kiri ke kanan."],
["E",2,"Market supply?","Jumlah kuantiti semua firma dalam industri pada harga tertentu. Penjumlahan mendatar keluk firma."],
["E",2,"Format fungsi penawaran?","Qs = a + bP\na: Qs bila P=0; b: kecerunan (positif)."],
["E",2,"Fungsi penawaran: P1→20, P2→24?","b=(24-20)/(2-1)=4, a=20-4=16.\nQs = 16 + 4P"],
["E",2,"Determinan penawaran?","Harga barang itu sendiri, kos pengeluaran, jangkaan harga, tahap teknologi, bilangan penjual, cukai & subsidi, infrastruktur."],
["E",2,"Faktor yang geser supply ke kanan (naik)?","Kos pengeluaran turun, teknologi lebih baik, subsidi, cukai turun, lebih ramai penjual, infrastruktur baik."],
["E",2,"Faktor yang geser supply ke kiri (turun)?","Kos pengeluaran naik, cukai naik, jangkaan harga naik, penjual berkurang."],
["E",2,"Change in quantity supplied vs change in supply?","Quantity supplied: bergerak sepanjang keluk, sebab harga barang itu.\nSupply: keluk beralih, sebab faktor lain."],
["E",2,"Contoh keluk penawaran luar biasa (backward bending)?","Spekulasi harga pengeluar, dan penawaran buruh: gaji sangat tinggi, buruh kurangkan jam kerja kerana pilih masa lapang."],
["E",3,"Definisi market equilibrium?","Interaksi demand & supply sehingga Qd = Qs pada harga tertentu. Tiada kecenderungan harga & kuantiti berubah. Keluk demand bertemu supply."],
["E",3,"3 kaedah cari keseimbangan?","Mathematical equation (Qd = Qs), Table method, Graphical method."],
["E",3,"Contoh: Qd=95-5P, Qs=67+2P. Cari P & Q.","95-67 = 7P, P=4.\nQ = 95-20 = 75 (semak Qs = 67+8 = 75).\nP = RM4, Q = 75 unit."],
["E",3,"Contoh: Qd=150-8P, Qs=30+2P. Cari P & Q.","120 = 10P, P=12.\nQ = 150-96 = 54.\nP = RM12, Q = 54 unit."],
["E",3,"Contoh: Qd=250-15P, Qs=130+15P. Cari P & Q.","120 = 30P, P=4.\nQ = 250-60 = 190.\nP = RM4, Q = 190 unit."],
["E",3,"Langkah cari keseimbangan matematik?","1. Qd = Qs, selesaikan P\n2. Gantikan P ke Qd untuk Q\n3. Semak dengan Qs"],
["E",3,"Excess supply (surplus)?","Qs > Qd pada harga tertentu (harga di atas keseimbangan). Cth: RM15, demand 40, supply 80, lebihan 40 unit."],
["E",3,"Excess demand (shortage)?","Qd > Qs pada harga tertentu (harga di bawah keseimbangan). Cth: RM5, demand 80, supply 40, kekurangan 40 unit."],
["E",3,"Demand naik: kesan pada keseimbangan?","Keluk D beralih ke kanan. Harga naik, kuantiti naik."],
["E",3,"Supply naik: kesan pada keseimbangan?","Keluk S beralih ke kanan. Harga turun, kuantiti naik."],
["E",3,"Apa itu price ceiling?","Harga maksimum ditetapkan kerajaan, di bawah keseimbangan. Hasilkan shortage (Qd > Qs). Cth: beras, gula, minyak masak."],
["E",3,"Kebaikan & keburukan price ceiling?","Baik: pengguna beli harga lebih murah.\nBuruk: black market, kuantiti dihasilkan berkurang, pengeluar terima bayaran haram. Tindakan: rationing."],
["E",3,"Apa itu price floor?","Harga minimum ditetapkan kerajaan, di atas keseimbangan. Hasilkan surplus (Qs > Qd). Cth: sokongan harga pertanian, gaji minimum."],
["E",3,"Kebaikan & keburukan price floor?","Baik: lindungi pendapatan pengeluar, gaji lebih tinggi.\nBuruk: pengguna bayar lebih, pembaziran sumber, pengangguran."]
,
["E",1,"Apa itu consumer goods (durable & perishable)?","Barang akhir yang memberi kepuasan kepada pengguna.\nDurable (tahan lama): kipas elektrik, radio.\nPerishable (mudah rosak): makanan."],
["E",1,"Apa itu ekonomi Islam?","Berasaskan Al-Quran dan Al-Hadith. Keputusan ekonomi lebih berdasarkan maslahah. Menekankan kebahagiaan di dunia dan akhirat."],
["E",1,"Kebaikan ekonomi Islam?","Menjamin kebajikan sosial; elak riba & monopoli; agihan kekayaan dan pendapatan sama rata; kebebasan memiliki sumber."],
["E",1,"Ekonomi Islam selesaikan masalah asas?","What: bebas mengeluarkan tertakluk hukum Islam.\nHow: maksimumkan pengeluaran, minimumkan kos.\nFor whom: ikut kuasa beli dan pendapatan individu."],
["E",1,"Mixed economy selesaikan masalah asas?","What: ditentukan price mechanism; barang kebajikan & persendirian.\nHow: kaedah ikut manfaat & kos sosial.\nFor whom: price mechanism melalui dasar cukai dan subsidi."],
["E",1,"Opportunity cost pada PPC (contoh jadual makanan & komputer)?","Opportunity cost makanan = penurunan makanan / pertambahan komputer.\nSetiap perpindahan sepanjang PPC menambah 2 komputer, dengan korban makanan 1, 2, 3, 4, 5 unit (A→B hingga E→F). Opportunity cost makin besar."],
["E",2,"Apa itu exceptional demand curve (regresif di bahagian atas)?","Barang mewah / status symbol: pada harga tinggi tertentu, harga naik tetapi kuantiti diminta juga naik (kerana bangga & status). Bahagian atas keluk membengkok ke belakang (regressive)."],
["E",2,"Apa itu exceptional demand curve (regresif di bahagian bawah)?","Barang inferior / Giffen: apabila harga jatuh di bawah paras tertentu, kuantiti diminta turun. Pendapatan benar naik, pengguna beralih beli barang berkualiti lebih tinggi."],
["E",2,"Kesan cukai vs subsidi pada supply?","Cukai: kos pengeluaran naik, supply turun (keluk beralih ke kiri).\nSubsidi: kos pengeluaran turun, supply naik (keluk beralih ke kanan)."],
["E",3,"Cari keseimbangan dengan kaedah jadual?","Cari harga di mana kuantiti diminta (Qd) = kuantiti ditawar (Qs).\nCth: P=4, Qd=75, Qs=75. Harga seimbang RM4, kuantiti seimbang 75 unit."],
["E",3,"Kesan demand & supply naik/turun serentak dengan magnitud SAMA?","D naik & S naik sama: harga tetap, kuantiti naik.\nD turun & S turun sama: harga tetap, kuantiti turun.\nD naik & S turun sama: harga naik, kuantiti tetap.\nD turun & S naik sama: harga turun, kuantiti tetap."],
["E",3,"Kesan D & S berubah ke arah sama, magnitud TIDAK sama?","D naik > S naik: harga naik, kuantiti naik.\nD naik < S naik: harga turun, kuantiti naik.\nD turun > S turun: harga turun, kuantiti turun.\nD turun < S turun: harga naik, kuantiti turun."],
["E",3,"Kesan D & S berubah ke arah bertentangan, magnitud TIDAK sama?","D naik > S turun: harga naik, kuantiti naik.\nD naik < S turun: harga naik, kuantiti turun.\nD turun > S naik: harga turun, kuantiti turun.\nD turun < S naik: harga turun, kuantiti naik."],
["E",4,"Apa itu elasticity?","Ukuran kepekaan (responsiveness) satu pemboleh ubah terhadap perubahan pemboleh ubah lain. Cth: bila harga naik 10%, elasticity mengukur berapa banyak demand berubah."],
["E",4,"Definisi price elasticity of demand (PED)?","Ukuran kepekaan kuantiti diminta sesuatu barang terhadap perubahan harganya, ceteris paribus.\n% Qd > % P: elastic.\n% Qd < % P: inelastic."],
["E",4,"Formula price elasticity of demand?","Ed = (Q1 - Q0)/Q0 × P0/(P1 - P0)\nQ0: kuantiti asal, Q1: kuantiti baharu, P0: harga asal, P1: harga baharu."],
["E",4,"Contoh PED: harga RM2 ke RM4, Qd 80 ke 50.","Ed = (50-80)/80 × 2/(4-2) = -30/80 × 2/2 = -0.375.\nNilai mutlak 0.375 < 1, maka inelastic."],
["E",4,"5 darjah PED dan nilainya?","Elastic: 1 < Ed < ∞\nInelastic: 0 < Ed < 1\nUnitary elastic: Ed = 1\nPerfectly elastic: Ed = ∞\nPerfectly inelastic: Ed = 0"],
["E",4,"Elastic demand (Ed > 1)?","% perubahan harga < % perubahan Qd. Perubahan kecil harga menyebabkan perubahan besar Qd. Barang status symbol / banyak substitut. Keluk condong (tilted)."],
["E",4,"Inelastic demand (Ed < 1)?","% perubahan harga > % perubahan Qd. Perubahan besar harga hanya sedikit mengubah Qd. Barang keperluan (necessity). Keluk curam (steep)."],
["E",4,"Unitary elastic demand (Ed = 1)?","% perubahan harga = % perubahan Qd. Barang biasa (normal goods). Keluk berbentuk hiperbola."],
["E",4,"Perfectly elastic vs perfectly inelastic demand?","Perfectly elastic (Ed = ∞): perubahan harga sangat kecil menyebabkan Qd berubah tanpa had; keluk mendatar (cth: kerajaan tetapkan harga siling/lantai).\nPerfectly inelastic (Ed = 0): Qd tidak berubah apabila harga berubah; keluk menegak (cth: beras, gula)."],
["E",4,"Hubungan PED dengan total revenue (TR)?","TR = P × Q. Maklumat PED membantu penjual melaras harga kerana ia mempengaruhi TR.\nElastic: harga naik, TR turun.\nInelastic: harga naik, TR naik.\nUnitary: TR tidak berubah."],
["E",4,"Contoh elastic demand dan TR?","Harga RM20 × 10 = RM200. Harga naik RM30, Q jadi 5: TR = RM150.\nΔTR = turun RM50. Harga naik, TR turun; harga turun, TR naik."],
["E",4,"Contoh inelastic demand dan TR?","Harga RM1 × 15 = RM15. Harga naik RM2, Q jadi 10: TR = RM20.\nΔTR = naik RM5. Harga naik, TR naik."],
["E",4,"Unitary & perfectly inelastic demand: kesan pada TR?","Unitary: RM1×20 = RM20; RM2×10 = RM20, TR tidak berubah.\nPerfectly inelastic: RM6×100 = RM600; RM8×100 = RM800, TR naik RM200."],
["E",4,"6 penentu PED?","1. Kewujudan substitut\n2. Perkadaran perbelanjaan ke atas barang\n3. Sifat barang\n4. Tempoh masa\n5. Tabiat pengguna\n6. Penjenamaan (branding)"],
["E",4,"Huraian penentu PED?","Substitut banyak: demand lebih elastic; tiada substitut: inelastic.\nBarang murah: kurang peka harga; barang mahal: elastic.\nNecessity: inelastic.\nJangka pendek: inelastic (substitut sukar dicari).\nTabiat: inelastic.\nSetia pada jenama: inelastic."],
["E",4,"Definisi income elasticity of demand (Ey)?","Mengukur kepekaan kuantiti diminta terhadap perubahan pendapatan.\nEy = (Q1 - Q0)/Q0 × Y0/(Y1 - Y0)"],
["E",4,"Contoh Ey: pendapatan RM1000 ke RM2000, Qd barang X 100 ke 150.","Ey = (150-100)/100 × 1000/(2000-1000) = 50/100 × 1 = 0.5.\nEy < 1: inelastic, barang biasa (normal goods)."],
["E",4,"Jenis barang mengikut Ey?","Ey > 1 (elastic): barang mewah (kereta, jam berjenama).\n0 < Ey < 1 (inelastic): normal goods (ikan, buku).\nEy = 1: comfort/superior goods.\nEy < 0: inferior goods (pendapatan naik, Qd turun; cth kereta terpakai, baju kedai amal).\nEy = 0: necessity (garam, beras, elektrik)."],
["E",4,"Definisi cross elasticity of demand (Exy)?","Mengukur kepekaan kuantiti diminta satu barang (X) terhadap perubahan harga barang berkaitan (Y).\nExy = (Qdx1 - Qdx0)/Qdx0 × Py0/(Py1 - Py0)"],
["E",4,"Nilai Exy dan hubungan barang?","Exy > 0 (positif): substitute goods.\nExy < 0 (negatif): complementary goods.\nExy = 0: tiada hubungan."],
["E",4,"Contoh Exy: harga Z RM1.20 ke RM1.60. Qd A 12→8, B 12→20, C 20→20.","A: -1, complementary.\nB: +2, substitute.\nC: 0, tiada hubungan."],
["E",4,"Definisi price elasticity of supply (PES) & formulanya?","Mengukur kepekaan kuantiti ditawar terhadap perubahan harga barang itu.\nEs = (Q1 - Q0)/Q0 × P0/(P1 - P0)"],
["E",4,"Darjah PES?","Elastic: Es > 1 (keluk condong).\nInelastic: Es < 1 (keluk curam).\nUnitary: Es = 1 (keluk bermula dari titik asal).\nPerfectly elastic: Es = ∞ (mendatar).\nPerfectly inelastic: Es = 0 (menegak, Qs tidak terjejas harga)."],
["E",4,"Contoh PES: harga RM2 ke RM4, Qs 50 ke 100.","Es = (100-50)/50 × 2/(4-2) = 1 × 1 = 1.\nUnitary elastic."],
["E",4,"Penentu PES?","1. Kos pengeluaran (kos besar untuk tambah pengeluaran: inelastic)\n2. Ketersediaan & mobiliti faktor pengeluaran\n3. Tempoh masa\n4. Bilangan firma dalam industri\n5. Masa pengeluaran"],
["E",4,"Tempoh masa dan PES?","Sangat jangka pendek: perfectly inelastic.\nJangka pendek: inelastic.\nJangka panjang: elastic.\nFirma ramai: supply elastic. Masa pengeluaran panjang: supply inelastic."],
["E",5,"Definisi production & inputs/outputs?","Production: proses menggunakan faktor pengeluaran untuk menghasilkan barang & perkhidmatan (menukar inputs kepada outputs).\nInputs: faktor pengeluaran yang digunakan.\nOutputs: barang siap pada akhir proses."],
["E",5,"Faktor pengeluaran & bayarannya?","Land: sewa (rent)\nLabour: upah/gaji (wage)\nCapital: faedah/dividen (interest/dividend)\nEntrepreneur: keuntungan (profit)\nTeknologi juga disenaraikan sebagai faktor."],
["E",5,"Ciri land & labour?","Land: sumber asli, terhad & tetap, dinilai ikut lokasi & kualiti.\nLabour: mahir & tidak mahir, bekalan tenaga fizikal & mental, mudah berpindah, dibezakan ikut kelayakan & kemahiran."],
["E",5,"Ciri capital & entrepreneur?","Capital: modal tunai, tetap dan kerja (bahan mentah).\nEntrepreneur: ada kemahiran mengurus firma cekap & menguntungkan; menggabungkan sumber; pemimpin, perancang, penyusun, pembuat keputusan, pengawal aktiviti firma."],
["E",5,"Fixed inputs vs variable inputs?","Fixed: tidak boleh ditambah/dikurangkan dalam jangka pendek, tidak berubah dengan output. Cth: mesin, tanah, bangunan, peralatan.\nVariable: boleh diubah dalam jangka pendek, berubah dengan output. Cth: bahan mentah, elektrik, bahan api, pengangkutan."],
["E",5,"Intermediate goods vs final goods?","Intermediate goods: output satu unit pengeluaran yang digunakan sebagai input unit lain.\nFinal goods: output untuk penggunaan akhir pengguna."],
["E",5,"Apa itu firm & industry?","Firm: organisasi/unit pengeluaran yang memiliki & menggunakan faktor pengeluaran terhad untuk hasilkan barang & perkhidmatan. Objektif: maksimumkan keuntungan.\nIndustry: sekumpulan firma dalam pasaran yang sama yang menghasilkan barang sejenis."],
["E",5,"3 tempoh masa pengeluaran?","1. Market period / very short run: firma tidak mampu menambah pengeluaran.\n2. Short run: sekurang-kurangnya satu input tetap & satu input boleh ubah.\n3. Long run: semua input boleh ubah, pengeluaran lebih cekap."],
["E",5,"Formula total production (TP), average production (AP), marginal production (MP)?","TP = AP × TL (TL = jumlah input boleh ubah)\nAP = TP / TL\nMP = ΔTP / ΔTL (perubahan TP apabila input boleh ubah ditambah 1 unit)"],
["E",5,"Contoh pengiraan AP & MP (jadual buruh)?","Buruh 4: TP 26. AP = 26/4 = 6.5. MP = 26 - 16 = 10 (TP buruh 3 ialah 16).\nBuruh 9: TP 34, MP = 0. Buruh 10: TP 24, MP = -10."],
["E",5,"Fungsi pengeluaran (production function)?","Hubungan fungsi antara input dan output, menunjukkan output maksimum dengan input tertentu.\nQ = f(Land, Labour, Capital, Entrepreneur).\nJangka pendek: Q = f(C, Lb), modal tetap."],
["E",5,"Hukum pulangan berkurangan (law of diminishing returns)?","Penambahan berterusan input boleh ubah kepada input tetap menyebabkan pengeluaran naik pada kadar meningkat dahulu, kemudian kadar lebih perlahan, dan akhirnya kadar negatif."],
["E",5,"3 hukum marginal returns?","Increasing marginal return (IMR): tambah 1 unit input boleh ubah, TP naik sangat banyak (Stage 1).\nDiminishing marginal return (DMR): TP naik lebih perlahan (Stage 2).\nNegative marginal return (NMR): TP menurun (Stage 3)."],
["E",5,"3 peringkat pengeluaran?","Stage 1: input tetap lebih banyak dari input boleh ubah, kurang guna input tetap, membazir.\nStage 2: law of diminishing returns, peringkat paling cekap.\nStage 3: input tetap lebih sedikit, terlalu sesak, TP menurun; pengeluar tidak mahu beroperasi di sini."],
["E",5,"Hubungan TP dan MP?","MP positif & naik: TP naik pada kadar meningkat.\nMP positif & turun: TP naik lebih perlahan.\nMP = 0: TP maksimum.\nMP negatif: TP turun."],
["E",5,"Hubungan TP, AP dan MP pada titik utama?","MP memotong AP pada AP maksimum (AP = MP).\nTP maksimum bila MP = 0.\nBila AP naik, TP naik; AP turun tetapi positif, TP masih boleh naik hingga MP = 0."],
["E",5,"Ringkasan peringkat pengeluaran (TP, AP, MP)?","Stage 1: TP naik pada kadar meningkat, AP naik, MP naik kemudian mula turun.\nStage 2: TP naik pada kadar menurun hingga maksimum, AP turun (selepas puncak), MP turun hingga sifar.\nStage 3: TP turun, AP terus turun, MP negatif."],
["E",6,"Apa itu production cost?","Kos yang ditanggung firma dalam proses menukar sumber kepada barang siap. Terbahagi kepada kos tetap & kos boleh ubah, serta kos eksplisit & implisit."],
["E",6,"Explicit cost vs implicit cost?","Explicit: nilai sumber yang dibeli untuk pengeluaran, kos nyata dibayar firma (upah, bahan mentah, pengangkutan).\nImplicit: nilai perkhidmatan input yang digunakan dalam pengeluaran tetapi tidak dibeli di pasaran (kos tersembunyi)."],
["E",6,"Konsep kos: opportunity, sunk, social?","Opportunity cost: nilai sumber dalam kegunaan terbaik seterusnya.\nSunk cost: kos yang tidak boleh diperoleh semula daripada perbelanjaan yang dibuat.\nSocial cost: jumlah kos pengeluaran termasuk kos langsung & tidak langsung."],
["E",6,"Fixed cost vs variable cost?","Fixed cost: tidak berubah dengan tahap pengeluaran, tidak boleh dielak dalam jangka pendek (sewa bangunan, susut nilai mesin).\nVariable cost: kos input yang berubah dengan output; sifar bila output sifar (bahan mentah, kuasa, bahan api, pengangkutan)."],
["E",6,"Formula TFC, TVC, TC?","TFC = TC - TVC (atau AFC × Q)\nTVC = TC - TFC (atau AVC × Q)\nTC = TFC + TVC (atau AC × Q)"],
["E",6,"Formula AFC, AVC, AC?","AFC = TFC / Q (atau AC - AVC)\nAVC = TVC / Q (atau AC - AFC)\nAC = TC / Q (atau AFC + AVC)"],
["E",6,"Formula marginal cost (MC)?","MC = ΔTC / ΔQ\nKos tambahan untuk menghasilkan satu unit output lagi. Dalam jangka pendek, TC naik kerana TVC naik (kos tetap tidak berubah)."],
["E",6,"Contoh pengiraan kos (TFC 30)?","Q=2: TVC 30, TC 60. AC = 60/2 = 30. AFC = 30/2 = 15. AVC = 30/2 = 15.\nMC dari Q=1 (TC 50) ke Q=2 (TC 60) = (60-50)/(2-1) = 10."],
["E",6,"Bentuk keluk TFC, TVC dan TC?","TFC: garisan mendatar.\nTVC: bermula dari asal, menaik.\nTC = TVC + TFC, bermula dari paras TFC dan selari dengan bentuk TVC."],
["E",6,"Bentuk keluk AFC, AVC, AC dan MC?","AFC: menurun dari kiri ke kanan (semakin banyak output, AFC semakin kecil).\nAVC, AC & MC: berbentuk U, disebabkan law of diminishing marginal returns."],
["E",6,"Hubungan MC dengan AC dan AVC?","MC memotong AVC dan AC pada titik minimum masing-masing.\nMC di bawah AC/AVC: AC/AVC menurun.\nMC di atas AC/AVC: AC/AVC menaik.\nAVC mencapai minimum lebih awal berbanding AC."],
["E",6,"Hubungan produktiviti dan kos?","AP naik hingga maksimum, AC turun hingga minimum; AP turun, AC naik.\nMP naik hingga maksimum, MC turun hingga minimum; MP turun, MC naik.\nAP = MP (AP maks) sepadan MC = AVC (AVC min)."],
["E",6,"Long run average cost (LRAC)?","Menunjukkan kos purata minimum menghasilkan sesuatu output bila semua input boleh ubah. Dalam jangka panjang tiada kos tetap (LRTC bermula dari asal).\nLRAC diterbitkan daripada siri keluk SRAC."],
["E",6,"Bentuk U LRAC dan returns to scale?","LRAC berbentuk U kerana Law of Returns to Scale: apabila firma membesar, LRAC turun dahulu kemudian naik.\nIncreasing returns to scale (LRAC turun), constant (mendatar), decreasing (LRAC naik)."],
["E",6,"Economies of scale?","Kelebihan firma apabila skala pengeluaran membesar. Mengurangkan LRAC.\nJenis: marketing, financial, labour, technical, managerial economies."],
["E",6,"Economies of scale: faktor dalaman?","Labour, Managerial, Marketing, Technical, Risk bearing, Transport & storage economies."],
["E",6,"Economies of scale: faktor luaran?","Kelebihan seluruh industri:\nEconomies of government action, concentration, information, dan marketing."],
["E",6,"Diseconomies of scale?","Masalah firma apabila terlalu besar; menaikkan LRAC.\nDalaman: labour diseconomies, managerial problem, technical difficulties.\nLuaran: kekurangan bahan mentah (scarcity of raw material), perbezaan upah (wage differential), concentration problem."],
["E",7,"Apa itu market structure & market?","Market: tempat pembeli dan penjual bertemu untuk berurus niaga.\nMarket structure: bilangan & saiz pembeli dan penjual, sifat produk, kawalan harga dan syarat kemasukan; menerangkan kuasa firma menentukan harga pasaran."],
["E",7,"4 struktur pasaran?","1. Perfect competition\n2. Monopoly\n3. Monopolistic competition\n4. Oligopoly"],
["E",7,"Objektif firma & keseimbangan firma?","Objektif: maksimumkan keuntungan & minimumkan kos.\nKeseimbangan firma: tiada kecenderungan menambah atau mengurangkan output; output keseimbangan memberi untung maksimum."],
["E",7,"2 kaedah menentukan keseimbangan firma?","Total approach: keseimbangan bila beza TR - TC paling besar.\nMarginal approach: keseimbangan bila MR = MC."],
["E",7,"Perfect competition market (PCM): definisi?","Pasaran/industri dengan bilangan penjual dan pembeli yang ramai menjual barang yang sama (homogeneous) pada harga yang ditetapkan pasaran. Cth: sayur, buah, hasil pertanian."],
["E",7,"5 ciri PCM?","1. Ramai penjual & pembeli\n2. Barang homogeneous\n3. Firma ialah price taker\n4. Bebas masuk & keluar\n5. Mobiliti sempurna faktor pengeluaran"],
["E",7,"Penjelasan ciri PCM?","Ramai penjual: tindakan satu firma tidak mempengaruhi harga.\nHomogeneous: pembeli tidak boleh bezakan kualiti, bungkusan, warna; sempurna substitut.\nPrice taker: terima harga pasaran.\nBebas keluar masuk.\nInput boleh dipindah tanpa halangan dan dibeli pada harga sama."],
["E",7,"Keluk demand firma dalam PCM?","Mendatar (selari paksi kuantiti) pada harga pasaran, perfectly elastic. Keluk demand firma = AR = MR = P.\nHarga ditentukan oleh persilangan DD dan SS industri."],
["E",7,"Konsep revenue: TR, AR, MR?","TR = P × Q\nAR = TR / Q\nMR = ΔTR / ΔQ\nDalam PCM: P = AR = MR (cth harga RM10: TR 10, 20, 30...; AR = MR = 10)."],
["E",7,"PCM total approach (contoh harga RM10)?","Untung maksimum bila TR - TC paling besar dan positif: output 6 unit, untung RM11 (TR 60, TC 49).\nBreakeven (TC = TR): output 3 dan 9 unit.\nRugi pada output 0-2 dan lebih 10 unit."],
["E",7,"PCM marginal approach (MR = MC)?","Firma maksimumkan untung pada MR = MC; keluk MC memotong MR dari bawah.\nCth: output 6 unit, TR 60, TC 50, untung = RM10."],
["E",7,"3 jenis keuntungan jangka pendek & syaratnya?","Supernormal (economic) profit: TR > TC, P > ATC; hanya jangka pendek, menarik firma baharu.\nNormal profit (breakeven): TR = TC, P = ATC.\nSubnormal profit (economic loss): TR < TC, P < ATC; TR masih tampung semua kos boleh ubah dan sebahagian kos tetap."],
["E",7,"Shutdown point dalam PCM?","Titik di mana AR = AVC (P = minimum AVC). Jika P di bawah AVC, firma berhenti pengeluaran dan keluar pasaran.\nJika P < ATC tetapi P ≥ AVC, firma boleh terus beroperasi.\nJangka pendek: AR < AVC; jangka panjang: AR < AC."],
["E",7,"Keseimbangan jangka panjang PCM?","Semua input boleh ubah; keseimbangan bila LRMC = LRMR. Hanya normal profit (zero economic profit) kerana bebas masuk & keluar.\nSyarat: P = SMC = LMC = SRAC = LRAC = AR = MR."],
["E",7,"Definisi monopoly?","Struktur pasaran dengan satu penjual yang menjual produk unik tanpa pengganti rapat, dan ada halangan kemasukan firma baharu."],
["E",7,"5 ciri monopoly?","1. Satu penjual, ramai pembeli (firma = industri)\n2. Produk unik\n3. Halangan masuk & keluar\n4. Price maker\n5. Tiada pengiklanan (hanya untuk perhubungan pelanggan)"],
["E",7,"Halangan kemasukan (barriers to entry) monopoly?","1. Pemilikan faktor pengeluaran tertentu\n2. Halangan undang-undang (hak paten, hak cipta)\n3. Halangan kewangan (modal besar)\n4. Pemilikan teknologi pengeluaran khusus\n5. Halangan kerajaan (cth barang keperluan, supaya dapat economies of scale)"],
["E",7,"Keluk demand, AR dan MR monopoly?","Keluk demand menurun (kerana monopolis hanya boleh kawal harga ATAU kuantiti), sama dengan keluk pasaran dan AR (AR = DD).\nMR berada di bawah AR dan boleh jadi negatif.\nCth: Q4, harga RM2, TR 8, MR -1."],
["E",7,"Monopoly: total approach (contoh)?","TR - TC paling besar dan positif pada output 5 unit (TR 30, TC 24), untung RM6.\nBreakeven di sekitar 6.5 unit."],
["E",7,"Monopoly: marginal approach (contoh)?","MR = MC pada output 5 unit dan harga RM6.\nUntung = TR - TC = RM30 - RM24 = RM6.\nBawah 5 unit MR > MC (tambah output naikkan untung); atas 5 unit MC > MR."],
["E",7,"Keseimbangan jangka panjang monopoly?","Juga MR = MC. Monopoli memperoleh supernormal profit dalam jangka panjang kerana halangan kemasukan menyekat firma baharu. Untung jangka panjang boleh lebih besar daripada jangka pendek."],
["E",7,"Definisi monopolistic competition?","Struktur pasaran dengan ramai firma kecil menjual produk yang dibezakan tetapi substitut rapat, dengan kemasukan & keluar yang mudah."],
["E",7,"Ciri monopolistic competition (6)?","1. Ramai penjual\n2. Produk dibezakan (pembungkusan, reka bentuk, label, iklan, jenama)\n3. Bebas masuk & keluar (tidak semudah PCM)\n4. Non-price competition penting\n5. Kos jualan (selling cost)\n6. Firma ada sedikit kawalan harga"],
["E",7,"Keluk demand monopolistic competition?","Menurun dari kiri ke kanan. Firma ada sedikit kuasa pasaran. Lebih elastic berbanding demand monopoly. Keluk demand = AR."],
["E",7,"Monopolistic competition: contoh keuntungan & jangka panjang?","MR = MC pada 40 unit, harga RM5: TR = RM200, TC = RM80, untung RM120 (jangka pendek).\nJangka panjang: normal profit kerana bebas masuk & keluar; DD = LRAR menyentuh LRATC."],
["E",7,"Definisi oligopoly?","Struktur pasaran dengan beberapa firma sahaja (bilangan kecil, saiz besar) menjual produk piawai atau dibezakan, dengan kemasukan dan keluar yang dihadkan."],
["E",7,"Ciri-ciri oligopoly?","1. Bilangan firma sedikit\n2. Produk homogeneous (petrol, simen, besi) atau dibezakan (sabun, ubat gigi, minyak masak, minuman ringan)\n3. Mutual interdependence\n4. Halangan kemasukan\n5. Price leadership\n6. Non-price competition"],
["E",7,"Price leadership: dominant vs barometric?","Firma lain mengikut harga yang ditetapkan firma peneraju.\nDominant: firma terbesar menguasai industri, bertindak seperti monopoli.\nBarometric: satu firma (tidak dominan) umum perubahan harga dahulu dan diikuti yang lain."],
["E",7,"Price cut vs non-price competition dalam oligopoly?","Price cut: pesaing bertindak balas cepat, risiko price war.\nNon-price competition (iklan, pemasaran, servis lepas jualan, hadiah percuma): tindak balas pesaing perlahan dan tidak langsung; penambahbaikan kualiti & iklan tidak mudah ditiru."],
["E",7,"Apa itu cartel?","Kumpulan firma yang matlamatnya mengehadkan persaingan, mengurangkan ketidakpastian, menstabilkan bahagian pasaran & harga. Bertindak bersama seperti monopoli untuk dapat supernormal profit. Cth: OPEC. Untung dibahagi ikut tahap pengeluaran."],
["E",7,"Kinked demand curve & price rigidity?","Pengeluar oligopoli menghadapi 2 keluk demand.\nHarga naik: pesaing tak ikut, firma hilang pelanggan.\nHarga turun: pesaing ikut, firma tak untung tambahan.\nMaka keluk 'berkinking' dan harga stabil (price rigidity)."],
["E",7,"Kinked demand: MR, MC dan keseimbangan?","Ada jurang (gap) pada keluk MR di bawah titik kink. Keseimbangan MR = MC pada titik kink (P*, Q*).\nSelagi MC melalui jurang itu, harga & kuantiti seimbang tidak berubah walaupun MC naik."],
["E",7,"4 sebab wujudnya oligopoly?","1. Economies of scale\n2. Product differentiation\n3. Profitable position (kos rendah, kawal bahan mentah/paten)\n4. Modal kewangan besar (halang firma baharu)"],
["E",7,"Perbandingan 4 struktur pasaran (penjual, produk, kemasukan, kawalan harga)?","PCM: ramai, sama, sangat mudah, tiada.\nMonopoly: satu, unik, mustahil, ada.\nMonopolistic: ramai, dibezakan, mudah, sedikit.\nOligopoly: sedikit, sama atau dibezakan, sukar, besar."],
["E",7,"Perbandingan jangka panjang 4 struktur pasaran?","PCM & monopolistic: normal profit (bebas masuk keluar).\nMonopoly & oligopoly: supernormal profit (halangan masuk).\nProduction efficiency (pada AC minimum): hanya PCM.\nShutdown: jangka pendek AR < AVC; jangka panjang AR < AC."]

["M",1,"Definisi pemasaran (CIM, 2007)?","Proses pengurusan yang bertanggungjawab mengenal pasti, menjangka dan memenuhi keperluan pelanggan secara menguntungkan."],
["M",1,"Definisi pemasaran (AMA, 2007)?","Aktiviti, set institusi dan proses untuk mencipta, berkomunikasi, menyampaikan dan menukar tawaran yang bernilai kepada pelanggan, klien, rakan kongsi dan masyarakat."],
["M",1,"Definisi pemasaran (Philip Kotler)?","Proses di mana syarikat mencipta nilai untuk pelanggan dan membina hubungan pelanggan yang kukuh, supaya dapat menangkap nilai daripada pelanggan sebagai balasan."],
["M",1,"Definisi pemasaran dengan ayat mudah?","Proses di mana individu dan kumpulan mendapatkan apa yang mereka perlu & mahu melalui mencipta dan menukar nilai & produk dengan orang lain."],
["M",1,"Pandangan lama vs baharu pemasaran?","Lama: membuat jualan (telling and selling).\nBaharu: memenuhi keperluan pelanggan (satisfying customer needs)."],
["M",1,"5 konsep teras pemasaran?","1. Needs, wants & demands\n2. Market offerings\n3. Value & satisfaction\n4. Marketers & market\n5. Exchange, transaction & relationships"],
["M",1,"Apa itu customer needs?","Keadaan kekurangan (state of deprivation) sesuatu yang diperlukan oleh seseorang.\nBentuk: fizikal (makanan, pakaian, keselamatan), sosial (rasa dimiliki, kasih sayang), individu (ilmu, ekspresi diri)."],
["M",1,"5 bentuk needs mengikut hierarki Maslow?","Physiological (makanan, tempat tinggal, pakaian)\nSafety (keselamatan, insurans, CCTV)\nSocial (cinta, rasa dimiliki)\nSelf esteem (penghargaan, prestij)\nSelf actualization (kepuasan diri, ekspresi diri)"],
["M",1,"Apa itu teori hierarki Maslow?","Model memahami motivasi tingkah laku manusia, dipetakan pada piramid. Manusia termotivasi memenuhi keperluan asas dahulu sebelum keperluan yang lebih tinggi."],
["M",1,"Apa itu wants?","Bentuk yang diambil oleh needs manusia, dibentuk oleh budaya dan personaliti individu melalui proses pembelajaran.\nCth: lapar (need), mahu nasi ayam & teh tarik (want)."],
["M",1,"Apa itu demands?","Wants yang disokong oleh kuasa beli.\nWant + purchasing power = demand. Hanya yang mampu membeli dikira dalam demand."],
["M",1,"Apa itu market offering?","Gabungan produk, perkhidmatan, maklumat atau pengalaman yang ditawarkan kepada pasaran untuk memenuhi need atau want. Tidak terhad kepada produk fizikal."],
["M",1,"Definisi product & bentuknya?","Apa sahaja yang boleh ditawarkan kepada pasaran untuk perhatian, pemerolehan, penggunaan atau penggunaan yang memenuhi want & need.\nFizikal: buku, mesin.\nBukan fizikal: perkhidmatan, idea, aktiviti, orang, tempat."],
["M",1,"Apa itu services?","Aktiviti atau manfaat yang ditawarkan untuk jualan, pada asasnya tidak ketara (intangible) dan tidak menghasilkan pemilikan apa-apa. Cth: perbankan, penerbangan, hotel, pembaikan rumah."],
["M",1,"Apa itu value?","Perbezaan antara total customer value dan total customer cost.\nCth: Celcom 'lebih nilai lebih menjimatkan'; restoran: makanan sedap, wifi percuma, selesa."],
["M",1,"Apa itu satisfaction & 3 keadaannya?","Perbezaan antara perceived performance produk dengan jangkaan pembeli.\nPerformance < jangkaan: dissatisfied.\nPerformance = jangkaan: satisfied.\nPerformance > jangkaan: delighted."],
["M",1,"Kesan satisfied vs dissatisfied customers?","Satisfied: beli lagi & beritahu orang lain.\nDissatisfied: beralih kepada pesaing & mengkritik produk.\nValue & satisfaction ialah blok binaan hubungan pelanggan."],
["M",1,"Siapa marketer & tugasnya?","Orang yang bertanggungjawab mengenal pasti barang/perkhidmatan yang dikehendaki pelanggan dan memasarkannya bagi pihak syarikat.\nTugas: tetapkan matlamat, segmentasi pelanggan sasaran, kaji pesaing, berkomunikasi dengan khalayak sasaran, jaga hubungan pelanggan, cipta kandungan, bajet & kempen."],
["M",1,"Apa itu market & 5 jenis pasaran pelanggan?","Set pembeli sebenar dan berpotensi bagi sesuatu produk, yang berkongsi needs & wants dan boleh dipuaskan melalui exchange.\n5 jenis: Consumer, Business, Government, Reseller, International."],
["M",1,"Apa itu exchange & 5 syaratnya?","Tindakan mendapatkan objek yang dikehendaki daripada seseorang dengan menawarkan sesuatu sebagai balasan.\nSyarat: min. 2 pihak; ada sesuatu bernilai untuk ditawarkan; boleh berkomunikasi & menghantar; bebas menerima/menolak tawaran; berminat berurusan."],
["M",1,"Apa itu transaction?","Berlaku apabila persetujuan dicapai semasa exchange. Unit asas pengukuran exchange. Melibatkan sekurang-kurangnya dua benda bernilai, syarat dipersetujui, masa & tempat persetujuan.\nJenis: monetary atau barter."],
["M",1,"Apa itu relationships dalam pemasaran & faedahnya?","Ikatan antara pelanggan dengan produk/pengeluarnya, dibina melalui transaksi berulang untuk manfaat bersama jangka panjang.\nFaedah: meningkat customer loyalty, customer lifetime value, share of customer."],
["M",1,"Apa itu marketing myopia?","Hanya fokus pada wants sedia ada dan terlepas pandang needs asas pengguna. Kesilapan memberi perhatian pada produk tertentu berbanding manfaat & pengalaman yang dihasilkan produk itu."],
["M",1,"Definisi marketing ethics?","Bidang etika gunaan yang berkaitan prinsip moral di sebalik operasi & peraturan pemasaran. Meliputi hubungan pengedar, piawaian pengiklanan, khidmat pelanggan, harga, pembangunan produk dan piawaian etika umum."],
["M",1,"Mengapa etika penting dalam pemasaran?","Etika ialah asas pemasaran mampan. Dalam jangka panjang, pemasaran tidak beretika merugikan pelanggan & masyarakat, merosakkan reputasi & keberkesanan syarikat, dan mengancam kelangsungannya."],
["M",1,"Apa itu ethical marketing?","Penerapan marketing ethics dalam proses pemasaran. Memberi manfaat kepada masyarakat jangka pendek & panjang, dan menggalakkan syarikat memasarkan produk dengan lebih bertanggungjawab sosial. Cth: trend fair trade."],
["M",1,"Apa itu corporate marketing ethics?","Garis panduan luas yang mesti dipatuhi semua dalam organisasi, dibangunkan oleh firma untuk menangani isu & dilema: distributor relation, advertising standards, customer service, pricing, product development, general ethical standards."],
["M",1,"Isu tidak beretika dalam Pricing?","Harga mesti beri value for money, tiada 'hidden extras'.\nIsu: too high markups, iaitu barang dijual dengan margin terlalu tinggi berbanding kos pengeluaran (pengguna dakwa penjual tamak)."],
["M",1,"Isu tidak beretika dalam Promotion?","Promotion to children: ibu bapa bimbang anak terlalu sedar jenama & tabiat makan buruk akibat iklan.\nDeceptive promotion: peraduan hadiah mengelirukan; tawaran harga sangat rendah tanpa nyatakan jumlah stok, pengguna terpaksa beli versi lebih mahal & kurang berkualiti."],
["M",1,"Isu tidak beretika dalam Distribution?","High distribution cost: akibat perkhidmatan tidak perlu, pengurusan lemah, dan terlalu banyak perantara yang menaikkan harga produk.\nEtika juga merangkumi kesan logistik kepada alam sekitar & akses kumpulan pelanggan."],
["M",1,"Isu tidak beretika dalam Packaging & labelling?","Deceptive packaging: pembungkusan besar tetapi isi tidak penuh, mengelirukan pelanggan.\nPembungkusan juga menyumbang sisa domestik & landfill."],
["M",1,"Isu tidak beretika dalam Product development?","Too few social products/goods. Cth: makanan ringan berbungkus plastik perlukan kawalan pencemaran; banyak kereta di jalan raya memerlukan jalan baharu & baik pulih.\nSocial goods patut dibangunkan seiring barang persendirian."],
["M",1,"Isu tidak beretika dalam Retailing?","Limit customer choice: peruncit hanya menyimpan barisan produk yang menguntungkan, dan menghapuskan persaingan harga sehingga gagal beri value for money. Peruncit besar berpengaruh ke atas pelanggan & pembekal."],
["M",1,"Definisi social responsibility?","Kerangka etika yang menyatakan individu/organisasi mempunyai obligasi bertindak demi kebaikan masyarakat. Mengekalkan keseimbangan antara ekonomi dan ekosistem."],
["M",1,"Social responsibility: pasif vs aktif & intergenerational?","Pasif: mengelak tindakan yang memudaratkan masyarakat.\nAktif: melakukan aktiviti yang memajukan matlamat sosial.\nIntergenerational: tindakan satu generasi memberi kesan kepada generasi seterusnya."],
["M",1,"Apa itu socially responsible marketing?","Mengambil tindakan bermoral yang memberi kesan positif kepada semua stakeholders: pekerja, komuniti, pengguna dan pemegang saham. Tanggungjawab marketer: membungkus & menyampaikan keputusan organisasi yang memberi kesan kepada komuniti."],
["M",1,"4 peranan social responsibility dalam pemasaran?","Safety: amaran jelas untuk produk berbahaya.\nHonesty: iklan telus, jangan puff up keputusan.\nEthical pricing: kaji berapa pelanggan sanggup bayar.\nRespecting customer privacy: jangan jual atau ambil maklumat tanpa izin."],
["M",1,"Bagaimana social responsibility berfungsi dalam pemasaran (4 manfaat)?","1. Engaging customers\n2. Improving the company's brand\n3. Retaining top talent\n4. Helping the company stand out from the competition"],
["M",1,"Contoh corporate social responsibility?","Coca-Cola: inisiatif 5by20 (2010) memperkasa 5 juta wanita usahawan menjelang 2020.\nVisa: financial inclusion, wang digital ke kawasan tanpa infrastruktur kewangan.\nTesla: kereta elektrik.\nSyarikat sarung kaki: setiap bundle dijual, derma 1 bundle."],
["M",2,"Definisi marketing environment?","Faktor dan kuasa yang mempengaruhi keupayaan pengurusan pemasaran menjalankan aktiviti pemasaran serta membina & mengekalkan hubungan berjaya dengan pelanggan sasaran."],
["M",2,"Microenvironment & 6 komponennya?","Kuasa yang rapat dengan syarikat yang mempengaruhi keupayaan melayan pelanggan.\n1. The company\n2. Suppliers\n3. Marketing intermediaries\n4. Competitors\n5. Publics\n6. Customers"],
["M",2,"The Company dalam microenvironment?","Pengurusan pemasaran melibatkan top management, finance, R&D, purchasing, operations dan accounting.\nTop management menetapkan misi, objektif, strategi luas dan polisi."],
["M",2,"Apa itu suppliers & tugas marketer terhadapnya?","Firma/individu yang menyediakan sumber untuk menghasilkan barang & perkhidmatan.\nMarketer perlu pantau bekalan, kekurangan/kelewatan, mogok buruh kerana boleh menaikkan kos jualan dan menjejaskan hubungan pelanggan."],
["M",2,"Apa itu marketing intermediaries & 4 jenisnya?","Firma yang membantu syarikat mempromosi, menjual & mengedar barang kepada pembeli akhir.\n4 jenis: Resellers, Physical distribution firms, Marketing services agencies, Financial intermediaries."],
["M",2,"Apa itu reseller?","Syarikat/individu (peniaga) yang membeli barang/perkhidmatan dengan niat menjualnya semula, bukan menggunakannya. Biasanya untuk untung (boleh juga dijual rugi)."],
["M",2,"Apa itu physical distribution firms?","Aktiviti bekalan produk siap pada setiap langkah dari barisan pengeluaran hingga pengguna.\nFungsi: customer service, order processing, inventory control, transportation & logistics, packaging & materials."],
["M",2,"Apa itu marketing services agencies?","Perniagaan berasaskan perkhidmatan yang mencipta, merancang dan mengendalikan pengiklanan (kadangkala promosi lain) untuk klien. Cth: agensi iklan Leo Burnett."],
["M",2,"Apa itu financial intermediaries?","Institusi seperti bank, building society atau unit trust yang memegang dana pemberi pinjaman untuk memberi pinjaman kepada peminjam."],
["M",2,"Peranan competitors?","Menurut konsep pemasaran, syarikat mesti beri nilai & kepuasan pelanggan lebih daripada pesaing. Mesti dapat strategic advantage dengan meletakkan tawaran kukuh berbanding pesaing dalam minda pengguna."],
["M",2,"Apa itu public & 7 jenisnya?","Mana-mana kumpulan yang mempunyai kepentingan atau kesan sebenar/berpotensi ke atas keupayaan organisasi mencapai objektif.\n7 jenis: Financial, Media, Government, Citizen-action, Local, General, Internal publics."],
["M",2,"Customers & 5 jenis target market?","Individu/firma yang membeli/menggunakan produk untuk penuhi needs & wants atau untuk untung.\n5 pasaran: Consumer, Business, Government, Reseller, International."],
["M",2,"Macroenvironment & 6 kuasanya?","Kuasa masyarakat yang lebih besar yang mempengaruhi seluruh microenvironment.\n1. Demographic\n2. Economic\n3. Natural\n4. Technological\n5. Political (& social)\n6. Cultural"],
["M",2,"Demographic environment?","Penduduk dari segi saiz, kepadatan, lokasi, umur, jantina, bangsa, pekerjaan & statistik lain.\nPerubahan: pertumbuhan penduduk pesat, perubahan struktur umur, migrasi luar bandar ke bandar, tahap pendidikan lebih tinggi, kepelbagaian etnik."],
["M",2,"Economic environment?","Faktor yang mempengaruhi kuasa beli dan corak perbelanjaan pengguna.\nTrend utama: perubahan tahap pendapatan dan perubahan corak perbelanjaan pengguna."],
["M",2,"Natural environment & 4 elemen utama?","Sumber asli yang diperlukan sebagai input oleh marketer.\n1. Kehabisan bahan mentah\n2. Kos tenaga meningkat\n3. Tahap pencemaran meningkat\n4. Campur tangan kerajaan dalam perlindungan alam sekitar"],
["M",2,"Technological environment?","Kuasa yang mencipta peluang produk & pasaran baharu. Syarikat perlu kekal di hadapan dan mengemas kini teknologi sendiri apabila ia menjadi lapuk."],
["M",2,"Political and social environment?","Semua undang-undang, agensi kerajaan dan kumpulan yang mempengaruhi atau menghadkan tindakan pemasaran.\nAda sekatan siapa sasaran pasaran (cth: rokok tidak boleh dipasarkan kepada kanak-kanak). Peraturan kerap berubah, perlu dipantau marketer."],
["M",2,"Cultural environment: core beliefs vs secondary beliefs?","Institusi serta nilai & kepercayaan asas sekumpulan orang.\nCore beliefs: diwarisi antara generasi, sukar diubah.\nSecondary beliefs: lebih mudah dipengaruhi.\nKempen perlu mencerminkan nilai khalayak sasaran."],
["M",3,"Siapa itu consumer?","Individu yang membeli produk/perkhidmatan untuk kegunaan peribadi, bukan untuk pembuatan atau jualan semula. Boleh membuat keputusan beli atau tidak, dan boleh dipengaruhi pemasaran & iklan."],
["M",3,"Consumer buyer behaviour & consumer market?","Consumer buyer behaviour: tingkah laku pembelian pengguna akhir (individu & isi rumah) untuk kegunaan peribadi.\nConsumer market: semua individu & isi rumah yang membeli/memperoleh barang & perkhidmatan untuk penggunaan peribadi."],
["M",3,"5 langkah consumer buying decision making process?","1. Need recognition\n2. Information search\n3. Evaluation of alternatives\n4. Purchase choice\n5. Post-purchase behaviour"],
["M",3,"Langkah 1: Need recognition?","Pembeli mengenal pasti masalah/need (desired state) yang mencetus keputusan menyelesaikannya.\nDicetuskan oleh: internal stimuli (cth: lapar) dan external stimuli (cth: iklan)."],
["M",3,"Langkah 2: Information search & 4 sumber?","Mencari maklumat tentang alternatif untuk memenuhi wants.\nPersonal: keluarga, kawan, jiran.\nCommercial: iklan, jurujual, peniaga, paparan.\nPublic: mass media, organisasi penilaian pelanggan.\nExperiential: pengalaman sendiri/orang lain mengendali & menggunakan produk."],
["M",3,"Langkah 3: Evaluation of alternatives (5 ukuran)?","Pelanggan menggunakan maklumat untuk menilai alternatif berdasarkan:\n1. Manfaat produk\n2. Tahap kepentingan setiap manfaat\n3. Brand beliefs\n4. Utility function produk\n5. Tahap kepuasan yang diperoleh"],
["M",3,"Langkah 4: Purchase choice?","Memutuskan produk mana dibeli (atau tidak beli langsung), kuantiti, peruncit/jurujual, tarikh & masa, cara bayar.\nBoleh bertindak cepat jika produk dijual murah; keputusan boleh berubah di lokasi jika dipengaruhi faktor lain."],
["M",3,"Langkah 5: Post-purchase behaviour?","Pengguna menilai produk dan menentukan puas hati atau tidak.\nPerformance < jangkaan: dissatisfied.\nPerformance = jangkaan: satisfied.\nPerformance > jangkaan: delighted."],
["M",3,"4 kumpulan faktor yang mempengaruhi consumer buying behaviour?","1. Cultural factors\n2. Social factors\n3. Personal factors\n4. Psychological factors"],
["M",3,"Cultural factors (3)?","Culture: nilai, idea & sikap diterima kumpulan homogen dan diwarisi generasi seterusnya.\nSub-culture: kebangsaan, agama, kaum, kawasan geografi (cth: hiasan pusat beli-belah musim Tahun Baru Cina, Hari Raya).\nSocial class: kumpulan dengan keadaan sosial & ekonomi serupa (pekerjaan, pendidikan, kekayaan)."],
["M",3,"Social factors (3)?","Reference group: kumpulan kecil yang mempengaruhi tingkah laku, sikap & self-concept.\nFamily: ahli keluarga (suami, isteri, anak) berpengaruh kuat pada pembelian.\nRoles and status: peranan ialah aktiviti yang dijangka daripada seseorang; setiap peranan membawa status."],
["M",3,"Personal factors (6)?","1. Age & life-cycle stage\n2. Occupation\n3. Economic situation\n4. Lifestyle\n5. Personality\n6. Self-concept"],
["M",3,"Personal factors: huraian setiap satu?","Age & life-cycle: barang dibeli berubah sepanjang hayat.\nOccupation: pekerjaan mempengaruhi barang dibeli.\nEconomic situation: pendapatan, simpanan & kadar faedah.\nLifestyle: corak hidup (aktiviti, minat, pendapat).\nPersonality & self-concept: ciri psikologi unik yang membawa respons konsisten."],
["M",3,"Psychological factors (5)?","1. Motivation\n2. Perception\n3. Learning\n4. Beliefs\n5. Attitudes"],
["M",3,"Motivation & perception?","Motivation: need yang cukup mendesak untuk mengarahkan seseorang mencari kepuasan (rujuk Maslow).\nPerception: proses memilih, menyusun & mentafsir maklumat membentuk gambaran bermakna tentang dunia, melalui 5 deria."],
["M",3,"Learning, belief & attitude?","Learning: perubahan tingkah laku individu hasil pengalaman.\nBelief: fikiran deskriptif seseorang tentang sesuatu.\nAttitude: penilaian, perasaan & kecenderungan yang agak konsisten terhadap objek atau idea."],
["M",3,"Business buying behaviour & business buyers?","Melibatkan business buyers, pasaran organisasi & pengguna, dan buying centres. Business buyers juga dipanggil business-to-business (B2B) atau industrial buyers."],
["M",3,"Business buyer behaviour (definisi)?","Tingkah laku pembelian organisasi yang membeli barang & perkhidmatan untuk digunakan dalam pengeluaran produk lain, atau untuk dijual semula atau disewakan kepada orang lain dengan untung."],
["M",3,"Produk yang lazim dibeli pelanggan perniagaan (7)?","1. Raw materials\n2. Semi-finished products\n3. Capital equipment\n4. Accessory equipment\n5. Parts\n6. Maintenance & repair\n7. Operating supplies"],
["M",3,"Business buying process (definisi)?","Proses keputusan di mana pembeli perniagaan menentukan produk & perkhidmatan yang diperlukan organisasi, kemudian mencari, menilai dan memilih antara pembekal dan jenama alternatif."],
["M",3,"8 langkah business buyer decision process (Kotler)?","1. Problem recognition\n2. General need description\n3. Product specification\n4. Supplier search\n5. Proposal solicitation\n6. Supplier selection\n7. Order-routine specification\n8. Performance review"],
["M",3,"Perbezaan business market vs consumer market?","Demand: organizational vs individual.\nDistribution: lebih direct vs lebih indirect.\nBuying unit: lebih professional vs lebih personal.\nKeputusan: kompleks & formal vs ringkas & tidak formal.\nReciprocity: ada vs tiada.\nLeasing: lebih banyak vs kurang."],
["M",4,"3 aktiviti utama (langkah STP)?","Segmentation: kenal pasti kumpulan pelanggan bermakna.\nTargeting: pilih segmen untuk dilayan.\nPositioning: bina & tingkatkan brand equity kepada sasaran terpilih (melalui product, price, place, promotion)."],
["M",4,"Definisi market segmentation?","Membahagikan pasaran kepada kumpulan berbeza dengan needs, ciri atau tingkah laku berbeza yang mungkin memerlukan produk atau marketing mix berasingan. Mengumpul orang ikut persamaan berkaitan kategori produk."],
["M",4,"4 asas segmentasi pasaran pengguna?","1. Geographic\n2. Demographic\n3. Psychographic\n4. Behavioral"],
["M",4,"Geographic segmentation?","Membahagikan pasaran kepada unit geografi: negara, negeri, wilayah, bandar atau kejiranan."],
["M",4,"Demographic segmentation?","Berdasarkan pemboleh ubah demografi: umur, jantina, saiz keluarga, pekerjaan, pendidikan, agama, kaum, kitaran hayat keluarga, pendapatan dan kewarganegaraan."],
["M",4,"Psychographic segmentation?","Berdasarkan cara orang berfikir: kelas sosial, gaya hidup (lifestyle), motif dan ciri personaliti."],
["M",4,"Behavioral segmentation?","Berdasarkan reaksi, respons, pengetahuan & sikap terhadap produk: occasions, benefits, usage rate, user status dan brand loyalty."],
["M",4,"Definisi market targeting?","Set pembeli yang berkongsi needs atau ciri sama yang syarikat putuskan untuk dilayan."],
["M",4,"3 faktor segment evaluation?","1. Segment size & growth potential\n2. Segment attractiveness\n3. Company objectives & resources"],
["M",4,"Segment size & growth potential?","Syarikat mesti kumpul & analisis data jualan segmen semasa, kadar pertumbuhan dan jangkaan keuntungan pelbagai segmen."],
["M",4,"Bila segmen kurang menarik (segment attractiveness)?","Jika sudah ada:\ni. Ramai pesaing kuat & agresif\nii. Banyak produk pengganti (substitute)\niii. Kuasa pembeli (buyers) tinggi\niv. Pembekal (suppliers) berkuasa"],
["M",4,"Company objectives and resources?","Syarikat mesti pertimbangkan objektif & sumbernya sendiri. Mencapai segmen pasaran memerlukan sumber besar, cth perbelanjaan pengedaran & penyelidikan pasaran."],
["M",4,"4 strategi pemilihan target market?","1. Undifferentiated (mass) marketing\n2. Differentiated (segmented) marketing\n3. Concentrated (niche) marketing\n4. Micromarketing"],
["M",4,"Undifferentiated (mass) marketing?","Abaikan perbezaan segmen dan mensasarkan seluruh pasaran dengan satu tawaran. Produk sama kepada semua pengguna (tiada segmentasi). Cth: beras Cap Rambutan, minuman Coca-Cola."],
["M",4,"Differentiated (segmented) marketing?","Mensasarkan beberapa segmen pasaran dan mereka tawaran berasingan untuk setiap segmen (segmentasi sebahagian)."],
["M",4,"Concentrated (niche) marketing?","Mengejar bahagian besar satu atau beberapa segmen/niche. Sesuai bila sumber syarikat terhad. Cth: Maersk Line."],
["M",4,"Micromarketing: local vs individual marketing?","Menyesuaikan produk & program pemasaran kepada individu atau kumpulan tempatan.\nLocal marketing: ikut bandar, kejiranan, malah kedai tertentu.\nIndividual marketing: ikut keperluan & kehendak individu (one-to-one marketing)."],
["M",4,"Definisi market positioning?","Menetapkan produk menduduki tempat yang jelas, tersendiri dan diingini berbanding produk pesaing dalam minda pengguna sasaran.\nCth: Volvo diposisikan pada 'safety'."],
["M",4,"Differentiation & positioning strategy: value proposition & product's position?","Value proposition: bagaimana mencipta nilai berbeza untuk segmen sasaran dan posisi yang ingin diduduki.\nProduct's position: cara produk ditakrif pengguna pada atribut penting, berbanding pesaing."],
["M",4,"3 langkah memilih differentiation & positioning strategy?","1. Kenal pasti perbezaan nilai pelanggan yang beri competitive advantage\n2. Pilih competitive advantage yang tepat & overall positioning strategy\n3. Komunikasi & sampaikan posisi terpilih kepada pasaran"],
["M",4,"Apa itu competitive advantage?","Kelebihan ke atas pesaing diperoleh dengan menawarkan nilai lebih kepada pengguna, melalui harga lebih rendah atau manfaat lebih yang wajarkan harga lebih tinggi."],
["M",4,"5 jenis differentiation?","Product: ciri, prestasi.\nService: penghantaran pantas, mudah, teliti.\nChannel: liputan & kepakaran saluran.\nPeople: ambil & latih orang lebih baik.\nImage: menyampaikan manfaat & posisi tersendiri."],
["M",4,"7 kriteria memilih competitive advantage?","Important, Distinctive, Superior, Communicable, Preemptive, Affordable, Profitable."],
["M",4,"Huraian 7 kriteria competitive advantage?","Important: manfaat bernilai tinggi.\nDistinctive: pesaing tak tawar/ditawar lebih unik.\nSuperior: lebih baik daripada cara lain.\nCommunicable: boleh dikomunikasi & nampak.\nPre-emptive: tidak mudah ditiru.\nAffordable: mampu dibayar.\nProfitable: menguntungkan syarikat."],
["M",4,"Apa itu value proposition (positioning)?","Gabungan penuh manfaat di mana sesuatu jenama diposisikan."],
["M",4,"5 overall positioning strategy (value proposition)?","1. More for more\n2. More for the same\n3. More for less\n4. The same for less\n5. Less for much less"],
["M",4,"More for more?","Produk paling mewah: kualiti, kemahiran, ketahanan, prestasi atau gaya unggul dan caj harga setanding. Beri prestij kepada pembeli. Harga tinggi."],
["M",4,"More for the same?","Menyerang pesaing dengan jenama yang menawarkan kualiti setanding pada harga lebih rendah. Cth slaid: Sony vs Samsung."],
["M",4,"The same for less?","Value proposition kuat kerana semua orang suka tawaran baik, diskaun mendalam seperti best buy."],
["M",4,"Less for much less?","Memenuhi keperluan prestasi/kualiti lebih rendah pelanggan pada harga jauh lebih rendah."],
["M",4,"More for less?","Biasanya jangka pendek, perniagaan baharu menawarkan produk kualiti terbaik pada harga lebih murah."],
["M",4,"Komunikasi & penyampaian posisi terpilih?","Selepas pilih posisi, syarikat mesti menyampaikan & mengkomunikasikannya kepada pasaran sasaran: reka marketing mix; ambil masa lama; kekalkan prestasi & komunikasi konsisten; pantau perubahan keperluan pengguna & strategi pesaing."],
["M",5,"Definisi product & service (Bab 5)?","Product: apa sahaja yang boleh ditawarkan kepada pasaran untuk perhatian, pemerolehan, penggunaan atau penggunaan yang memenuhi want/need.\nService: aktiviti/manfaat yang satu pihak tawarkan kepada pihak lain, tidak ketara & tidak menghasilkan pemilikan."],
["M",5,"3 tahap produk (three levels of product)?","1. Core product\n2. Actual product\n3. Augmented product"],
["M",5,"Core product?","Penggunaan, manfaat atau perkhidmatan penyelesaian masalah yang sebenarnya dibeli pengguna (customer value). Cth: kereta, memudahkan pergi ke sesuatu tempat."],
["M",5,"Actual product?","Produk ketara/perkhidmatan tidak ketara sebagai medium menerima manfaat core product. 5 ciri: quality, features, design, brand name, packaging."],
["M",5,"Augmented product?","Langkah membantu pengguna menggunakan produk secara berterusan: installation, delivery & credit, warranties, arahan penggunaan, after-sale service."],
["M",5,"Contoh 3 tahap produk: kamera digital Sony?","Core: dapat ambil gambar dengan mudah.\nActual: jenama Sony, pembungkusan, reka bentuk mudah, kualiti tinggi.\nAugmented: waranti, servis baik pulih pantas, nombor telefon bebas tol."],
["M",5,"Consumer products & 4 klasifikasinya?","Produk dibeli pengguna akhir untuk kegunaan peribadi.\n1. Convenience\n2. Shopping\n3. Specialty\n4. Unsought"],
["M",5,"Convenience products & 3 subkategorinya?","Dibeli kerap, segera, dengan usaha membeli & membandingkan minimum. Murah dan mudah dijumpai (cth: sabun, gula-gula, aiskrim, surat khabar).\nSubkategori: Staple, Impulse, Emergency."],
["M",5,"Staple, impulse & emergency products?","Staple: dibeli paling kerap untuk kegunaan biasa (cth: bijirin, detergen).\nImpulse: dibeli tanpa perancangan/usaha mencari (cth: coklat, snek, majalah hiburan).\nEmergency: dibeli ketika kecemasan (cth: lampu suluh, pemetik api, payung)."],
["M",5,"Shopping products?","Pengguna membandingkan ciri produk seperti kualiti, harga, kesesuaian & gaya semasa memilih; sanggup luang masa & usaha kumpul maklumat. Cth: perabot, pakaian, peralatan elektrik.\nTerdiri daripada homogeneous dan heterogeneous."],
["M",5,"Homogeneous vs heterogeneous shopping products?","Homogeneous: dilihat pada asasnya sama, pengguna cari harga terendah (cth: buah-buahan, sayur).\nHeterogeneous: berbeza kualiti, gaya & kesesuaian, sukar dibandingkan (cth: telefon bimbit, LCD TV, perabot antik)."],
["M",5,"Specialty products?","Ciri unik atau identiti jenama yang kumpulan pembeli sanggup berusaha khas membelinya. Jarang dibandingkan; banyak masa mencari kedai. Cth: kereta berjenama, telefon bimbit mewah, pakaian tempahan."],
["M",5,"Unsought products?","Pengguna tidak tahu atau tahu tetapi biasanya tidak terfikir membelinya. Cth: reverse osmosis water purifier, insurans, percutian. Perlu sokongan promosi yang kuat."],
["M",5,"Industrial products & 3 kumpulannya?","Produk dibeli individu/organisasi untuk pengeluaran atau tujuan perniagaan.\n1. Materials and parts\n2. Capital items\n3. Supplies and services"],
["M",5,"Materials and parts?","Produk asas yang diubah sepenuhnya menjadi sesuatu lain.\nRaw materials: farm products (gandum, kapas), natural products (kayu, petroleum, bijih besi).\nManufactured materials & parts: component material (besi, benang, simen), component parts (motor kecil, tayar)."],
["M",5,"Capital items?","Produk industri yang membantu pengeluaran/operasi pembeli.\nInstallations: bangunan (kilang, pejabat), fixed equipment (penjana, lif).\nAccessory equipment: peralatan kilang mudah alih (alat tangan), peralatan pejabat (komputer, mesin faks, meja)."],
["M",5,"Supplies and services (industrial)?","Supplies: tidak masuk produk siap, membantu operasi (minyak pelincir, alat tulis, komputer).\nServices: perkhidmatan perniagaan di bawah kontrak (nasihat undang-undang, perkhidmatan pembersihan, penyelenggaraan pejabat)."],
["M",5,"Apa itu brand & fungsinya?","Nama, istilah, tanda, simbol atau reka bentuk (atau gabungan) yang mengenal pasti pembuat/penjual produk.\nMembantu pengguna kenal produk, jenama & trademark beri perlindungan undang-undang, dan membantu segmentasi pasaran."],
["M",5,"Packaging & 3 jenisnya?","Mereka bentuk & menghasilkan bekas atau pembalut produk; mencipta identiti melalui reka bentuk, gaya & warna.\nPrimary: bekas terdekat (tiub ubat gigi).\nSecondary: kotak yang mengandungi tiub.\nShipping: kotak kadbod/kertas tebal."],
["M",5,"Labeling & fungsinya?","Sebahagian daripada packaging: maklumat bercetak pada produk/bungkusan.\nFungsi: kenal pasti produk/jenama, huraikan (tempat dibuat, bahan, cara guna), dan mempromosi dengan grafik menarik."],
["M",5,"Product support services?","Perkhidmatan tambahan untuk produk ketara: customer service, pantau maklum balas pelanggan, reka produk yang memerlukan servis, bentuk cara terbaik beri sokongan, wujudkan jabatan khidmat pelanggan yang cemerlang."],
["M",5,"Peringkat Product Life Cycle (PLC)?","Mengikut lengkung S: Product development, Introduction, Growth, Maturity, Decline."],
["M",5,"PLC: Introduction?","Jualan tumbuh perlahan. Tiada untung kerana perbelanjaan besar untuk promosi & pengedaran. Bina kesedaran & kesediaan pengguna mencuba dan membeli."],
["M",5,"PLC: Growth?","Jualan naik pantas, permintaan tinggi. Kos seunit mula turun kerana volum lebih besar. Fokus mengekalkan pertumbuhan pasaran dan mengukuhkan kedudukan bersaing."],
["M",5,"PLC: Maturity?","Pertumbuhan jualan perlahan & mula menurun. Kebanyakan pesaing turunkan harga & tambah promosi untuk kekalkan jualan.\nStrategi: market, product & marketing-mix modification."],
["M",5,"PLC: Decline?","Peringkat akhir: jualan & untung jatuh. Permintaan turun kerana banyak produk pengganti.\nStrategi: maintain, harvest, atau drop produk daripada barisan."]
].map((c,i)=>({id:i,s:c[0],ch:c[1],q:c[2],a:c[3]}));
const SUBJ={E:{name:'Mikroekonomi',chs:[[1,'Bab 1'],[2,'Bab 2'],[3,'Bab 3'],[4,'Bab 4'],[5,'Bab 5'],[6,'Bab 6'],[7,'Bab 7']],lab:n=>'Bab '+n},
M:{name:'Pemasaran',chs:[[1,'Topik 1'],[2,'Bab 2'],[3,'Bab 3'],[4,'Bab 4'],[5,'Bab 5']],lab:n=>n==1?'Topik 1':'Bab '+n}};
let sub='E',flt='0',wrong=new Set(),deck=[],i=0,show=false;
const $=id=>document.getElementById(id);
function inSub(){return D.filter(c=>c.s===sub)}
function buildBtns(){
 $('subs').innerHTML='';
 Object.keys(SUBJ).forEach(k=>{const b=document.createElement('button');b.className='sec sub'+(k===sub?' on':'');b.textContent=SUBJ[k].name+' ('+D.filter(c=>c.s===k).length+')';b.onclick=()=>{sub=k;flt='0';buildBtns();build()};$('subs').appendChild(b)});
 $('chs').innerHTML='';
 const items=[['0','Semua']].concat(SUBJ[sub].chs.map(x=>[String(x[0]),x[1]+' ('+D.filter(c=>c.s===sub&&c.ch===x[0]).length+')'])).concat([['r','Perlu ulang']]);
 items.forEach(([k,t])=>{const b=document.createElement('button');b.className='sec'+(k===flt?' on':'');b.textContent=t;b.onclick=()=>{flt=k;buildBtns();build()};$('chs').appendChild(b)});
}
function build(){
 deck=inSub().filter(c=>flt==='0'||(flt==='r'?wrong.has(c.id):c.ch==flt));
 i=0;show=false;render();
}
function render(){
 const c=deck[i];
 if(!c){$('card').innerHTML='<div class="q">Tiada kad di sini 🎉</div>';$('act').style.display='none';$('stat').textContent='';return}
 const wr=inSub().filter(x=>wrong.has(x.id)).length;
 $('stat').textContent='Kad '+(i+1)+' / '+deck.length+'   |   Perlu ulang: '+wr;
 $('card').innerHTML=show?'<div class="tag">Jawapan</div><div class="a"></div>':'<div class="tag">'+SUBJ[c.s].name+' · '+SUBJ[c.s].lab(c.ch)+' · Soalan</div><div class="q"></div><div class="hint">Cuba jawab dulu, kemudian ketik kad</div>';
 (show?$('card').querySelector('.a'):$('card').querySelector('.q')).textContent=show?c.a:c.q;
 $('act').style.display=show?'flex':'none';
}
function go(d){if(!deck.length)return;i=(i+d+deck.length)%deck.length;show=false;render()}
$('card').onclick=()=>{if(deck.length){show=!show;render()}};
$('nx').onclick=()=>go(1);$('pv').onclick=()=>go(-1);
$('sh').onclick=()=>{for(let k=deck.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[deck[k],deck[j]]=[deck[j],deck[k]]}i=0;show=false;render()};
$('bk').onclick=()=>{wrong.delete(deck[i].id);if(flt==='r'){deck.splice(i,1);if(i>=deck.length)i=0;show=false;render()}else go(1)};
$('bn').onclick=()=>{wrong.add(deck[i].id);go(1)};
buildBtns();build();
</script></body></html>
